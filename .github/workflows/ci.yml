# Runs on every pull request and on main. A red check is fixed in the code:
# thresholds and assertions are never lowered to make it pass.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Internal links (normal build)
        run: npm run check:links
      - name: Hygiene (files)
        run: npm run hygiene
      - name: Hygiene (commit messages in this pull request)
        if: github.event_name == 'pull_request'
        run: node scripts/check-hygiene.mjs --commits "origin/${{ github.base_ref }}..HEAD"

  e2e:
    name: Browser and accessibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Chromium and WebKit (Safari's engine), each on a desktop and a phone profile.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:e2e
      - name: Save report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Audit the site as it will be at launch: indexable, drafts hidden, and with the analytics
      # beacon on. The token is a made-up test value, so lighthouserc.json blocks the beacon's
      # report to Cloudflare; the script itself still downloads and runs, so its cost is measured.
      - run: npm run build
        env:
          PUBLIC_SITE_LAUNCHED: 'true'
          PUBLIC_CF_ANALYTICS_TOKEN: lighthouse-test-token
      # Drafts are not built here, so no page may link to one.
      - name: Internal links (launched build)
        run: npm run check:links
      # The sitemap exists only on the launched build; check its contents here.
      - name: Sitemap and robots.txt
        run: npx playwright test tests/e2e/sitemap.spec.ts --project=desktop
        env:
          PUBLIC_SITE_LAUNCHED: 'true'
      - run: npx --yes @lhci/cli@0.16.1 autorun
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          if-no-files-found: ignore

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Scans every commit in the repository, so the result does not depend on which commits a
      # push contains. The binary is pinned and checked against its published checksum.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'
