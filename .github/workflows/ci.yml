# Runs on every pull request and on main. A red check is fixed in the code:
# thresholds and assertions are never lowered to make it pass.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Hygiene (files)
        run: npm run hygiene
      - name: Hygiene (commit messages in this pull request)
        if: github.event_name == 'pull_request'
        run: node scripts/check-hygiene.mjs --commits "origin/${{ github.base_ref }}..HEAD"

  e2e:
    name: Browser and accessibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - name: Save report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Audit the site as it will be at launch: indexable, drafts hidden, and with the analytics
      # beacon on. The analytics token is a made-up test value, so lighthouserc.json blocks the
      # beacon's report to Cloudflare; the script itself still downloads and runs, so its cost is
      # measured. PUBLIC_AUDIT_FIXTURES adds one made-up project page (/portfolio/audit-example/),
      # so the project template is audited while every real project is a draft. Deployments never
      # set it.
      #
      # One page of every type is audited, one run each, at 95 in every category:
      #   lighthouserc.json          pages meant to be indexed
      #   lighthouserc.noindex.json  pages that are noindex on purpose (404, form thanks); these
      #                              skip only the "is-crawlable" audit, which checks for noindex
      - run: npm run build
        env:
          PUBLIC_SITE_LAUNCHED: 'true'
          PUBLIC_CF_ANALYTICS_TOKEN: lighthouse-test-token
          PUBLIC_AUDIT_FIXTURES: 'true'
      # The sitemap exists only on the launched build; check its contents here.
      - name: Sitemap and robots.txt
        run: npx playwright test tests/e2e/sitemap.spec.ts --project=desktop
        env:
          PUBLIC_SITE_LAUNCHED: 'true'
      - name: Check the audited pages against the build
        run: node scripts/check-audit-pages.mjs
      # Warm-up (see issue #72): the first audit in a job runs on a cold runner (Chrome's files,
      # font caches and the disk cache) and measured 7 to 15 times the style and layout work of
      # the same page audited right after it. Open Chrome once, with Lighthouse's flags, on
      # /services/renovations/, a page neither list audits. This is not a Lighthouse run, and
      # nothing carries over: every audit starts a fresh Chrome profile. The analytics report
      # host is mapped to nowhere, as the audits block it.
      - name: Warm up Chrome
        run: |
          python3 -m http.server 4310 --bind 127.0.0.1 --directory dist/client >/dev/null 2>&1 &
          server=$!
          sleep 1
          google-chrome --headless=new --no-sandbox \
            --host-resolver-rules="MAP cloudflareinsights.com ~NOTFOUND" \
            --dump-dom http://127.0.0.1:4310/services/renovations/ >/dev/null
          kill "$server"
      - name: Audit indexed pages
        run: npx --yes @lhci/cli@0.16.1 autorun
      - name: Audit noindex pages
        if: success() || failure()
        run: npx --yes @lhci/cli@0.16.1 autorun --config=lighthouserc.noindex.json
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          if-no-files-found: ignore

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Scans every commit in the repository, so the result does not depend on which commits a
      # push contains. The binary is pinned and checked against its published checksum.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'
